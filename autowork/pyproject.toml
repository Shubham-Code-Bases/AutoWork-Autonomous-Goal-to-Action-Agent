[project]
name = "autowork"
version = "0.4.0"
description = "AutoWork — Autonomous Goal-to-Action Agent (Phase 4: Google Cloud Asynchronous Runtime)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "google-adk>=2.0.0a0",
    "google-cloud-firestore>=2.14.0",
    "google-cloud-pubsub>=2.18.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true
